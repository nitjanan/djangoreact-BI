[project]
name = "fleet-backend"
version = "0.1.0"
description = "Fleet dashboard API (Django REST Framework)"
requires-python = "==3.9.5"
# เวอร์ชันล็อกให้ตรงกับ djangostock / djangoweight (Python 3.9.5)
# ตัวที่ fleet ใช้คนเดียว (drf-spectacular, fpdf2, uharfbuzz) ล็อกเป็นรุ่นล่าสุดที่รองรับ Python 3.9
dependencies = [
    # Django 4.2 LTS: MariaDB 10.4 (XAMPP) ไม่รองรับ Django 5.x
    "django==4.2.29",
    "django-filter==2.4.0",
    "django-import-export==2.6.1",
    "djangorestframework==3.14.0",
    "drf-spectacular==0.30.0",
    "fpdf2==2.8.4",
    "gunicorn==23.0.0",
    "mysqlclient==2.0.3",
    "python-dateutil==2.8.2",
    "python-dotenv==1.2.1",
    "requests==2.32.3",
    "tablib==3.1.0",
    "uharfbuzz==0.51.7",
    "whitenoise==5.3.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-django==4.11.1",
    "ruff>=0.17.5",
]

[tool.uv]
package = false
# dependency ทางอ้อมที่ stock / weight ล็อกไว้ ให้ตรงกัน
constraint-dependencies = [
    "asgiref==3.9.1",
    "sqlparse==0.4.3",
    "tzdata==2021.5",
    "typing-extensions==4.16.0",
    "six==1.16.0",
    "diff-match-patch==20200713",
    "certifi==2021.5.30",
    "charset-normalizer==3.4.0",
    "idna==2.10",
    "urllib3==2.2.3",
    "defusedxml==0.7.1",
    "pytz==2021.1",
    "openpyxl==3.0.9",
    "et-xmlfile==1.1.0",
    "xlrd==2.0.1",
    "xlwt==1.3.0",
    "odfpy==1.4.1",
    "markuppy==1.14",
    "pyyaml==6.0",
    "pillow==9.3.0",
    "colorama==0.4.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["dbapp/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
# models/forms คัดลอกจากโปรเจกต์เดิม: แก้ null=True ใน CharField ต้องทำ migration (ไว้ทีหลัง)
"dbapp/models.py" = ["DJ001"]
"dbapp/forms.py" = ["DJ007"]
